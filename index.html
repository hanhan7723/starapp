  .lucky { text-align: center; margin: 12px 0 4px; }
  button {

    padding: 11px 18px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 14px 0; }
  .tab {
    border: 1px solid #2c3563; background: #12173a; color: #eef1ff;
    border-radius: 999px; padding: 9px 15px; font-size: 14px;
  }
  .tab.active { background: #4a5cbf; border-color: #4a5cbf; color: #fff; font-weight: 600; }
  .search-box { display: flex; gap: 8px; margin-bottom: 14px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #2c3563;
    background: #12173a; color: #eef1ff; font-size: 16px; min-width: 0;
  }
  input:focus { outline: 2px solid #ffd166; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    border: 1px solid #2c3563; background: #12173a; border-radius: 999px;
    padding: 8px 14px; font-size: 14px; color: #eef1ff; cursor: pointer;
  }
  .chip.active { background: #4a5cbf; border-color: #4a5cbf; }
  .card { background: #161d42; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #232a54; }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 10px currentColor; flex: none; }
  .card h2 { font-size: 19px; display: inline; margin-right: 8px; }
  .card .en { color: #9aa3c7; font-size: 13px; }
  .meta { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: #232a54; border-radius: 8px; padding: 4px 10px; font-size: 12px; color: #cdd4f5; }
  .desc { margin-top: 10px; font-size: 14px; line-height: 1.65; color: #cdd4f5; }
  .row {
    background: #161d42; border: 1px solid #232a54; border-radius: 12px;
    padding: 11px 14px; margin-bottom: 8px; cursor: pointer;
  }
  .row:active { background: #1d2650; }
  .rank {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%; background: #232a54;
    font-size: 13px; margin-right: 10px;
  }
  .rank.top1 { background: #ffd166; color: #241f00; font-weight: 700; }
  .rank.top2 { background: #c7d2fe; color: #1a2140; font-weight: 700; }
  .rank.top3 { background: #f4a261; color: #241f00; font-weight: 700; }
  .back {
    background: #232a54; color: #cdd4f5; border-radius: 10px; padding: 9px 14px;
    margin-bottom: 12px; font-size: 14px;
  }
  #map, #skyCanvas { width: 100%; border-radius: 14px; display: block; border: 1px solid #232a54; }
  #skyCanvas { background: #05081c; touch-action: none; cursor: grab; }
  .legend { font-size: 12px; color: #9aa3c7; text-align: center; margin-top: 8px; line-height: 1.6; }
  .hint { text-align: center; color: #9aa3c7; font-size: 13px; margin: 18px 0; }
  footer { text-align: center; color: #5f6a99; font-size: 12px; margin-top: 24px; line-height: 1.7; }
#skySettings { background:#12173a; border:1px solid #2c3563; border-radius:12px; padding:10px 14px; margin-bottom:12px; }
#skySettings summary { cursor:pointer; color:#cdd4f5; font-size:14px; padding:2px 0; }

</style>

  kw = (kw || "").trim().toLowerCase();

// ================= 天文计算（定位 + 时间 -> 每颗星的高度角/方位角） =================
function nowJD() { return Date.now() / 86400000 + 2440587.5; }

function gmstDeg(jd) {
  var d = jd - 2451545.0;
  return ((280.46061837 + 360.98564736629 * d) % 360 + 360) % 360;
}

function normalizeAz(a) {
  a = a % 360;
  if (a > 180) a -= 360;
  if (a <= -180) a += 360;
  return a;
}

function starAltAz(s, latDeg, lonDeg, jd) {
  var raDeg = s.raH * 15;
  var lst = ((gmstDeg(jd) + lonDeg) % 360 + 360) % 360;
  var H = (lst - raDeg) * Math.PI / 180;
  var ph = latDeg * Math.PI / 180;
  var de = s.dec * Math.PI / 180;
  var sinAlt = Math.sin(ph) * Math.sin(de) + Math.cos(ph) * Math.cos(de) * Math.cos(H);
  var alt = Math.asin(Math.max(-1, Math.min(1, sinAlt))) * 180 / Math.PI;
  var az = (Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(ph) - Math.tan(de) * Math.cos(ph)) + Math.PI) * 180 / Math.PI;
  az = ((az % 360) + 360) % 360;
  return { alt: alt, az: az };
}

  var L = ((280.460 + 0.9856474 * n) % 360 + 360) % 360;
  var g = ((357.528 + 0.9856003 * n) % 360 + 360) % 360 * D2R;
  var lam = ((L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) % 360 + 360) % 360;
  var eps = (23.439 - 0.0000004 * n) * D2R;
  var la = lam * D2R;
  var ra = Math.atan2(Math.cos(eps) * Math.sin(la), Math.cos(la));
  var dec = Math.asin(Math.sin(eps) * Math.sin(la));
  return { raH: ((ra / D2R / 15) % 24 + 24) % 24, dec: dec / D2R, lam: lam };
}

function moonRaDec(jd) {
  var n = jd - 2451545.0;              // 距离 J2000.0 的天数
  var T = n / 36525;                   // 仅用于黄赤交角小项
  var Lp = ((218.316 + 13.176396 * n) % 360 + 360) % 360;
  var D = ((297.850 + 12.190749 * n) % 360 + 360) % 360;
  var M = ((357.529 + 0.985600 * n) % 360 + 360) % 360;
  var Mp = ((134.963 + 13.064993 * n) % 360 + 360) % 360;
  var F = ((93.272 + 13.229350 * n) % 360 + 360) % 360;
  var lam = Lp + 6.289 * Math.sin(Mp * D2R) + 1.274 * Math.sin((2 * D - Mp) * D2R)
          + 0.658 * Math.sin(2 * D * D2R) + 0.214 * Math.sin(2 * Mp * D2R) - 0.186 * Math.sin(M * D2R);
  var bet = 5.128 * Math.sin(F * D2R);
  var eps = (23.439291 - 0.0130042 * T) * D2R;
  var la = lam * D2R, be = bet * D2R;
  var dec = Math.asin(Math.sin(be) * Math.cos(eps) + Math.cos(be) * Math.sin(eps) * Math.sin(la));
  var ra = Math.atan2(Math.sin(la) * Math.cos(eps) - Math.tan(be) * Math.sin(eps), Math.cos(la));
  return { raH: ((ra / D2R / 15) % 24 + 24) % 24, dec: dec / D2R, lam: lam };
}

function moonIllum(jd) {
  var sm = sunRaDec(jd);
  var mm = moonRaDec(jd);
  var dlam = ((mm.lam - sm.lam) % 360 + 360) % 360;
  var k = (1 - Math.cos(dlam * D2R)) / 2;
  var age = dlam / 360 * 29.53059;
  var name;
  if (age < 1.85 || age >= 27.68) name = "新月";
  else if (age < 5.54) name = "娥眉月";
  else if (age < 9.23) name = "上弦月";
  else if (age < 12.92) name = "盈凸月";
  else if (age < 16.61) name = "满月";
  else if (age < 20.30) name = "亏凸月";
  else if (age < 23.99) name = "下弦月";
  else name = "残月";
  return { k: k, age: age, name: name };
}

function sunTimes(jd, lat, lon) {
  var sd = sunRaDec(jd);
  var n = jd - 2451545.0;
  var g = ((357.528 + 0.9856003 * n) % 360 + 360) % 360 * D2R;
  var eotMin = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
             - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  var ph = lat * D2R, de = sd.dec * D2R;
  var cosH0 = (Math.sin(-0.833 * D2R) - Math.sin(ph) * Math.sin(de)) / (Math.cos(ph) * Math.cos(de));
  if (cosH0 < -1) return { polar: "day" };
  if (cosH0 > 1) return { polar: "night" };
  var H0 = Math.acos(cosH0) / D2R / 15;
  var tzH = -new Date().getTimezoneOffset() / 60;
  var noon = 12 + (tzH * 15 - lon) / 15 + eotMin / 60;
  return { rise: noon - H0, set: noon + H0 };
}

function fmtHM(h) {
  h = ((h % 24) + 24) % 24;
  var hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  if (mm === 60) { hh = (hh + 1) % 24; mm = 0; }
  return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
}

<script id="app-ui">
// ================= 界面渲染 =================
var content = document.getElementById("content");
var tabs = document.querySelectorAll(".tab");

var skyState = {

function starCard(s) {
  var c = colorOf(s.spectral);

  h += '<span class="dot" style="background:' + c.hex + ';color:' + c.hex + '"></span>';

  h += '<div class="meta">';
  h += '<span class="tag">星座：' + s.cnConst + '</span>';
  h += '<span class="tag">星等：' + s.mag + '</span>';

  h += '<p class="desc">' + s.desc + '</p>';
  if (s.raH !== null && s.raH !== undefined && !s.isSun) {
    h += '<button onclick="locateStarByName(\'' + s.name + '\')" style="margin-top:10px;width:100%;background:#4a5cbf;color:#fff;">🔭 在星空中定位这颗星</button>';
  }
  h += '</div>';
  return h;
}

function rowHtml(s, i) {
  var cls = i === 0 ? " top1" : i === 1 ? " top2" : i === 2 ? " top3" : "";
  return '<div class="row" data-i="' + i + '">'

function showDetail(s) {

  document.getElementById("backBtn").addEventListener("click", renderView);
}

function renderSearch() {

  content.querySelectorAll(".chip").forEach(function (chip) {

function renderSeason() {

  }).join("") + '</div><div id="res"></div>';

  content.querySelectorAll(".chip").forEach(function (chip) {

function renderRank() {

    return '<button class="chip' + (n === rankN ? " active" : "") + '" data-n="' + n + '">Top ' + n + '</button>';
  }).join("") + '</div><div id="res"></div>';
  var res = document.getElementById("res");
  content.querySelectorAll(".chip").forEach(function (chip) {

      rankN = parseInt(chip.getAttribute("data-n"), 10);
      renderRank();

function renderAll() {
  currentList = allStars();
  content.innerHTML = '<div class="hint">共 ' + currentList.length + ' 颗（按亮度排序，点击查看详情）</div><div id="res"></div>';
  document.getElementById("res").innerHTML = currentList.map(rowHtml).join("");
  bindRows();
}

function renderMap() {
  content.innerHTML = '<canvas id="map"></canvas>'
    + '<div class="legend">全天星图（赤经×赤纬）· 88 星座连线 + ' + BG_STARS.length + ' 颗真实星表星 · 点击查看详情</div>'
    + '<div id="mapDetail"></div>';
  var canvas = document.getElementById("map");
  var w = Math.min(720, Math.max(320, content.clientWidth));
  var h = Math.round(w * 0.55);
  var dpr = window.devicePixelRatio || 1;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.style.margin = "0 auto";
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  var ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#0b0f2b";
  ctx.fillRect(0, 0, w, h);

  function mxy(raH, dec) { return { x: w - (raH / 24) * w, y: (90 - dec) / 180 * h }; }

  ctx.strokeStyle = "rgba(140,160,255,0.12)";
  ctx.lineWidth = 1;
  [-60, -30, 0, 30, 60].forEach(function (d) {
    var y = (90 - d) / 180 * h;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  });
  [0, 6, 12, 18, 24].forEach(function (ra) {
    var x = w - (ra / 24) * w;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  });

  ctx.strokeStyle = "rgba(150,170,255,0.25)";
  ctx.lineWidth = 1;
  Object.keys(CON_LINES).forEach(function (cid) {
    CON_LINES[cid].forEach(function (seg) {
      var a = mxy(seg[0][0], seg[0][1]), b = mxy(seg[1][0], seg[1][1]);
      if (Math.abs(a.x - b.x) > w * 0.8) return;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    });
  });

  var pts = [];
  BG_STARS.forEach(function (b) {
    var p = mxy(b[0], b[1]);
    var r = Math.max(0.7, Math.min(4, (4.4 - b[2]) * 0.8));
    ctx.fillStyle = "rgba(205,218,255,0.7)";
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    pts.push({ bg: b, x: p.x, y: p.y, r: Math.max(r, 4) });
  });

  STARS.forEach(function (s) {
    if (s.raH === null || s.raH === undefined) return;
    var p = mxy(s.raH, s.dec);
    var r = Math.max(3, Math.min(15, (3 - s.mag) * 2.4));
    var hex = colorOf(s.spectral).hex;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = hex;
    ctx.shadowColor = hex;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 0.5;
    ctx.stroke();
    pts.push({ s: s, x: p.x, y: p.y, r: r });
  });

  rankedStars(12).forEach(function (s) {
    var p = null;
    for (var i = 0; i < pts.length; i++) { if (pts[i].s && pts[i].s.name === s.name) { p = pts[i]; break; } }
    if (!p) return;
    ctx.fillStyle = "#cdd4f5";
    ctx.font = "10px sans-serif";
    ctx.fillText(s.cn, p.x + p.r + 2, p.y - p.r - 2);
  });

  ctx.fillStyle = "rgba(200,210,255,0.55)";
  ctx.font = "10px sans-serif";
  ctx.fillText("赤经 12h", w / 2 - 16, 12);
  ctx.fillText("24h", 6, 12);
  ctx.fillText("赤纬 0°", 6, h / 2 + 12);

  canvas.onclick = function (e) {
    var rect = canvas.getBoundingClientRect();
    var px = (e.clientX - rect.left) * (w / rect.width);
    var py = (e.clientY - rect.top) * (h / rect.height);
    var best = null, bd = 1e9;
    pts.forEach(function (p) {
      var d = Math.sqrt((px - p.x) * (px - p.x) + (py - p.y) * (py - p.y));
      if (d < bd) { bd = d; best = p; }
    });
    if (!best) return;
    if (best.s && bd <= best.r + 12) document.getElementById("mapDetail").innerHTML = starCard(best.s);
    else if (best.bg && bd <= 14) document.getElementById("mapDetail").innerHTML = bgStarCard(best.bg);
  };
}

// ================= 星空 360° 模式 =================
function getSkyJD() {
  return skyState.customJD || nowJD();
}

function getSkyPos(s) {
  if (skyState.loc) {
    return starAltAz(s, skyState.loc.lat, skyState.loc.lon, getSkyJD());
  }
  return { alt: s.dec, az: ((s.raH * 15) % 360 + 360) % 360 };
}

function projectPoint(az, alt, w, h, fovH) {
  var fovV = fovH * (h / w);
  var dx = normalizeAz(az - skyState.az0) / fovH * w;
  var dy = -(alt - skyState.alt0) / fovV * h;
  return { x: w / 2 + dx, y: h / 2 + dy };
}

function renderSky() {
  var canvas = document.getElementById("skyCanvas");
  if (!canvas) return;
  var w = skyState.cssW, h = skyState.cssH;
  var dpr = window.devicePixelRatio || 1;
  var ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  var g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#05081c");
  g.addColorStop(0.6, "#0a0f2e");
  g.addColorStop(1, "#101a38");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.translate(w / 2, h / 2);
  if (skyState.roll) ctx.rotate(-skyState.roll * Math.PI / 180);
  ctx.translate(-w / 2, -h / 2);

  function okVisible(alt) { return !skyState.showOnlyVisible || alt >= -1; }

  var fovV = skyState.fovH * (h / w);
  var hy = h / 2 + skyState.alt0 / fovV * h;
  if (hy > -40 && hy < h + 40) {
    ctx.strokeStyle = "rgba(140,220,140,0.4)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, hy); ctx.lineTo(w, hy); ctx.stroke();
    ctx.fillStyle = "rgba(160,240,160,0.6)";
    ctx.font = "11px sans-serif";
    [["北", 0], ["东", 90], ["南", 180], ["西", 270]].forEach(function (p) {
      var pt = projectPoint(p[1], 0, w, h, skyState.fovH);
      if (pt.x > 12 && pt.x < w - 12 && hy > -10 && hy < h + 14) {
        ctx.fillText(p[0], pt.x - 6, hy + 13);
      }
    });
  }

  var pts = [];

  if (skyState.showLines) {
    ctx.strokeStyle = "rgba(150,170,255,0.28)";
    ctx.lineWidth = 1;
    Object.keys(CON_LINES).forEach(function (cid) {
      CON_LINES[cid].forEach(function (seg) { drawSkySeg(ctx, seg, w, h, okVisible); });
    });
    ctx.strokeStyle = "rgba(190,210,255,0.22)";
    ASTERISMS.forEach(function (as) {
      as.segs.forEach(function (seg) { drawSkySeg(ctx, seg, w, h, okVisible); });
    });
  }

  for (var bi = 0; bi < BG_STARS.length; bi++) {
    var b = BG_STARS[bi];
    var bp = getSkyPos({ raH: b[0], dec: b[1] });
    if (!okVisible(bp.alt)) continue;
    var bpt = projectPoint(bp.az, bp.alt, w, h, skyState.fovH);
    if (bpt.x < -20 || bpt.x > w + 20 || bpt.y < -20 || bpt.y > h + 20) continue;
    var br = Math.max(0.7, Math.min(4, (4.4 - b[2]) * 0.8));
    ctx.fillStyle = "rgba(205,218,255,0.7)";
    ctx.beginPath();
    ctx.arc(bpt.x, bpt.y, br, 0, Math.PI * 2);
    ctx.fill();
    pts.push({ bg: b, x: bpt.x, y: bpt.y, r: Math.max(br, 5) });
  }

  STARS.forEach(function (s) {
    if (s.raH === null || s.raH === undefined) return;
    var p = getSkyPos(s);
    if (!okVisible(p.alt) && s !== skyState.targetStar) return;
    var pt = projectPoint(p.az, p.alt, w, h, skyState.fovH);
    if (pt.x < -30 || pt.x > w + 30 || pt.y < -30 || pt.y > h + 30) return;
    var r = Math.max(2, Math.min(12, (3 - s.mag) * 2.2));
    var hex = colorOf(s.spectral).hex;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
    ctx.fillStyle = hex;
    ctx.shadowColor = hex;
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;
    if (s.mag < 1.5) {
      ctx.fillStyle = "#cdd4f5";
      ctx.font = "10px sans-serif";
      ctx.fillText(s.cn, pt.x + r + 1, pt.y - r - 1);
    }
    pts.push({ s: s, x: pt.x, y: pt.y, r: r });
  });

  var jd = getSkyJD();
  var sunD = sunRaDec(jd);
  var moonD = moonRaDec(jd);
  var items = [];
  if (skyState.showSun) items.push({ kind: "sun", raH: sunD.raH, dec: sunD.dec });
  if (skyState.showMoon) items.push({ kind: "moon", raH: moonD.raH, dec: moonD.dec });
  for (var ii = 0; ii < items.length; ii++) {
    var it = items[ii];
    var ip = getSkyPos({ raH: it.raH, dec: it.dec });
    var ipt = projectPoint(ip.az, ip.alt, w, h, skyState.fovH);
    if (ipt.x < -40 || ipt.x > w + 40 || ipt.y < -40 || ipt.y > h + 40) continue;
    if (it.kind === "sun") {
      ctx.fillStyle = "#ffd166";
      ctx.shadowColor = "#ffd166";
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(ipt.x, ipt.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#ffe9b3";
      ctx.font = "11px sans-serif";
      ctx.fillText("太阳", ipt.x + 11, ipt.y + 4);
      pts.push({ sun: true, x: ipt.x, y: ipt.y, r: 12 });
    } else {
      var ph = moonIllum(jd);
      var r2 = 7;
      ctx.fillStyle = "#dfe6f5";
      ctx.beginPath();
      ctx.arc(ipt.x, ipt.y, r2, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.arc(ipt.x, ipt.y, r2, 0, Math.PI * 2);
      ctx.clip();
      var dir = ph.age < 14.77 ? -1 : 1;
      ctx.fillStyle = "#2e3557";
      ctx.beginPath();
      ctx.arc(ipt.x + dir * 2 * r2 * (1 - ph.k), ipt.y, r2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.arc(ipt.x, ipt.y, r2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "#cdd4f5";
      ctx.font = "11px sans-serif";
      ctx.fillText("月亮", ipt.x + 10, ipt.y + 4);
      pts.push({ moon: true, x: ipt.x, y: ipt.y, r: 11 });
    }
  }

  if (skyState.targetStar) {
    for (var ti = 0; ti < pts.length; ti++) {
      var tp = pts[ti];
      if (tp.s && tp.s.name === skyState.targetStar.name) {
        ctx.strokeStyle = "#ffd166";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, tp.r + 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(tp.x - tp.r - 12, tp.y); ctx.lineTo(tp.x - tp.r - 4, tp.y);
        ctx.moveTo(tp.x + tp.r + 4, tp.y); ctx.lineTo(tp.x + tp.r + 12, tp.y);
        ctx.moveTo(tp.x, tp.y - tp.r - 12); ctx.lineTo(tp.x, tp.y - tp.r - 4);
        ctx.moveTo(tp.x, tp.y + tp.r + 4); ctx.lineTo(tp.x, tp.y + tp.r + 12);
        ctx.stroke();
      }
    }
  }

  ctx.restore();
  skyPts = pts;
  updateSkyInfo();
  updateSunMoonInfo();
}

function updateSkyInfo() {
  var el = document.getElementById("skyInfo");
  if (!el) return;
  var t = skyState.customJD ? new Date((skyState.customJD - 2440587.5) * 86400000) : new Date();
  var lst = skyState.loc ? (gmstDeg(getSkyJD()) + skyState.loc.lon) % 360 : gmstDeg(getSkyJD());
  var txt = t.toLocaleTimeString();
  if (skyState.customJD) txt += "（自定义）";
  txt += " ｜ 恒星时 " + lst.toFixed(1) + "°";
  if (skyState.loc) {
    if (skyState.cityName) txt += " ｜ " + skyState.cityName;
    else txt += " ｜ " + skyState.loc.lat.toFixed(1) + "°N, " + skyState.loc.lon.toFixed(1) + "°E" + (skyState.loc.fallback ? "（默认）" : "");
  } else {
    txt += " ｜ 未定位，先按赤道坐标显示";
  }
  txt += " ｜ 视角：方位 " + Math.round(skyState.az0) + "° 高度 " + Math.round(skyState.alt0) + "°";
  var vis = STARS.filter(function (s) {
    return s.raH !== null && getSkyPos(s).alt > -1;
  }).length;
  txt += " ｜ 亮星可见 " + vis + " 颗";
  el.textContent = "拖动画面转动视角 · 点击星星看详情 ｜ " + txt;
}

function skyHint(msg) {
  var el = document.getElementById("skyInfo");
  if (el) el.textContent = msg;
}

function setFollow(on) {
  skyState.follow = on;
  var chip = document.getElementById("skyFollow");
  if (chip) {
    chip.textContent = on ? "🧭 跟随中…" : "🧭 跟随手机方向";
    chip.classList.toggle("active", on);
  }
  if (!on) return;
  if (typeof DeviceOrientationEvent !== "undefined"
      && typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission().then(function (r) {
      if (r === "granted") {
        skyHint("已开启！举起手机朝天空转动试试");
      } else {
        setFollow(false);
        skyHint("需要方向权限才能跟随，或直接用拖动浏览");
      }
    }).catch(function () {
      setFollow(false);
      skyHint("方向权限被拒绝，用拖动浏览吧");
    });
  } else if (typeof window.DeviceOrientationEvent === "undefined") {
    setFollow(false);
    skyHint("此设备不支持方向感应，试试拖动浏览（电脑上按住鼠标拖）");
  } else {
    skyHint("已开启！举起手机朝天空转动试试 🧭");
  }
}

function tryLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function (pos) {
      skyState.loc = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      var chip = document.getElementById("skyLoc");
      if (chip) chip.textContent = "📍 已定位";
      if (currentView === "sky") renderSky();
    }, function () {
      fallbackLoc();
    }, { timeout: 8000, maximumAge: 300000 });
  } else {
    fallbackLoc();
  }
}

function fallbackLoc() {
  skyState.loc = { lat: 22.3, lon: 114.2, fallback: true };
  var chip = document.getElementById("skyLoc");
  if (chip) chip.textContent = "📍 默认(香港)";
  if (currentView === "sky") renderSky();
}

  var canvas = document.getElementById("skyCanvas");
  var cssW = Math.min(720, Math.max(320, content.clientWidth));
  var cssH = Math.round(Math.min(520, Math.max(280, window.innerHeight * 0.5)));
  var dpr = window.devicePixelRatio || 1;
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  canvas.style.margin = "0 auto";
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  skyState.cssW = cssW;
  skyState.cssH = cssH;

  var timeInput = document.getElementById("skyTimeInput");
  if (timeInput) {
    var base = skyState.customJD ? new Date((skyState.customJD - 2440587.5) * 86400000) : new Date();
    timeInput.value = localInputValue(base);
    timeInput.addEventListener("change", function () {

      if (!name) {
        skyState.cityName = null;
        tryLocation();
      } else {
        for (var i = 0; i < CITIES.length; i++) {
          if (CITIES[i][0] === name) {
            skyState.loc = { lat: CITIES[i][1], lon: CITIES[i][2] };
            skyState.cityName = name;
            break;
          }
        }
        renderSky();
      }
    });
  });

  document.getElementById("skyFollow").addEventListener("click", function () {
    setFollow(!skyState.follow);
  });
  document.getElementById("skyLoc").addEventListener("click", function () {
    skyHint("正在获取位置…（允许浏览器权限）");
    tryLocation();
  });
  document.getElementById("skyVis").addEventListener("click", function () {
    skyState.showOnlyVisible = !skyState.showOnlyVisible;
    renderSkyTab();
  });
  document.getElementById("skyLines").addEventListener("click", function () {
    skyState.showLines = !skyState.showLines;
    renderSkyTab();
  });
  document.getElementById("skySun").addEventListener("click", function () {
    skyState.showSun = !skyState.showSun;
    renderSkyTab();
  });
  document.getElementById("skyMoon").addEventListener("click", function () {
    skyState.showMoon = !skyState.showMoon;
    renderSkyTab();
  });
  document.getElementById("skyIn").addEventListener("click", function () {
    skyState.fovH = Math.max(40, skyState.fovH - 10);
    renderSky();
  });
  document.getElementById("skyOut").addEventListener("click", function () {
    skyState.fovH = Math.min(100, skyState.fovH + 10);
    renderSky();
  });
  document.getElementById("skyAr").addEventListener("click", enterAR);

  canvas.addEventListener("pointerdown", function (e) {
    dragging = true; dragMoved = false;
    lastPX = e.clientX; lastPY = e.clientY;
    if (skyState.follow) setFollow(false);
    skyState.targetStar = null;
    var d = document.getElementById("skyDetail");
    if (d) d.innerHTML = "";
  });
  canvas.addEventListener("click", function (e) {
    if (dragMoved) return;
    var rect = canvas.getBoundingClientRect();
    var px = (e.clientX - rect.left) * (skyState.cssW / rect.width);
    var py = (e.clientY - rect.top) * (skyState.cssH / rect.height);
    var res = skyHit(px, py);
    var d = document.getElementById("skyDetail");
    if (!d) return;
    if (res && res.s) {
      skyState.targetStar = res.s;
      d.innerHTML = starCard(res.s);
      renderSky();
    } else if (res && res.kind) {
      d.innerHTML = sunMoonCard(res.kind);
    } else if (res && res.bg) {
      d.innerHTML = bgStarCard(res.bg);
    }
  });

  renderSky();
  if (!skyState.locTried) {
    skyState.locTried = true;
    tryLocation();
  }
}

function skyHit(px, py) {
  var w = skyState.cssW, h = skyState.cssH;
  var dx = px - w / 2, dy = py - h / 2;
  var rad = skyState.roll * Math.PI / 180;
  var rx = dx * Math.cos(rad) - dy * Math.sin(rad);
  var ry = dx * Math.sin(rad) + dy * Math.cos(rad);
  var qx = w / 2 + rx, qy = h / 2 + ry;
  var best = null, bd = 1e9;
  skyPts.forEach(function (p) {
    var d = Math.sqrt((qx - p.x) * (qx - p.x) + (qy - p.y) * (qy - p.y));
    if (d < bd) { bd = d; best = p; }
  });
  if (!best) return null;
  if (best.s && bd <= best.r + 12) return { s: best.s };
  if (best.sun && bd <= 18) return { kind: "sun" };
  if (best.moon && bd <= 18) return { kind: "moon" };
  if (best.bg && bd <= 14) return { bg: best.bg };
  return null;
}

// ================= AR 实景模式 =================
function enterAR() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("此浏览器不支持调用相机，请用 Chrome 或系统浏览器打开");
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
    .then(function (stream) {
      arStream = stream;
      content.innerHTML = '<div style="position:relative;border-radius:14px;overflow:hidden;border:1px solid #232a54;">'
        + '<video id="arVideo" autoplay playsinline muted style="width:100%;display:block;background:#000;"></video>'
        + '<canvas id="arOverlay" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;"></canvas>'
        + '<div style="position:absolute;left:10px;top:10px;display:flex;gap:8px;">'
        + '<button id="arShot" style="opacity:.9">📸 拍照</button>'
        + '<button id="arExit" style="opacity:.9;background:#232a54;color:#cdd4f5">✖ 退出</button>'
        + '</div></div>'
        + '<div class="legend">把手机朝向天空，星图实时跟随方向。📸 拍照会把星图合成进照片。AR 为方向叠加，不做照片识别。</div>'
        + '<div id="arCapture"></div>';
      var video = document.getElementById("arVideo");
      video.srcObject = stream;
      video.onloadedmetadata = function () { arLoop(); };
      document.getElementById("arExit").addEventListener("click", exitAR);
      document.getElementById("arShot").addEventListener("click", captureAR);
      if (!skyState.follow) setFollow(true);
    })
    .catch(function () {
      alert("无法打开相机：请检查浏览器相机权限。iOS 需要在 HTTPS 环境下才能使用相机。");
    });
}

function exitAR() {
  if (arStream) {
    arStream.getTracks().forEach(function (t) { t.stop(); });
    arStream = null;
  }
  renderView();
}

function arLoop() {
  if (!arStream || currentView !== "sky") return;
  drawAR();
  requestAnimationFrame(arLoop);
}

function drawAR() {
  var video = document.getElementById("arVideo"), ov = document.getElementById("arOverlay");
  if (!video || !ov || !video.videoWidth) return;
  var w = video.clientWidth, h = video.clientHeight;
  if (!w || !h) return;
  ov.width = w; ov.height = h;
  var ctx = ov.getContext("2d");
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate(-skyState.roll * Math.PI / 180);
  ctx.translate(-w / 2, -h / 2);
  STARS.forEach(function (s) {
    if (s.raH === null) return;
    var p = getSkyPos(s);
    if (skyState.showOnlyVisible && p.alt < -1) return;
    var pt = projectPoint(p.az, p.alt, w, h, 62);
    if (pt.x < -20 || pt.x > w + 20 || pt.y < -20 || pt.y > h + 20) return;
    var r = Math.max(2, Math.min(9, (3 - s.mag) * 1.8));
    var hex = colorOf(s.spectral).hex;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
    ctx.fillStyle = hex;
    ctx.shadowColor = hex;
    ctx.shadowBlur = 5;
    ctx.fill();
    ctx.shadowBlur = 0;
    if (s.mag < 0.5) {
      ctx.fillStyle = "#ffffff";
      ctx.font = "11px sans-serif";
      ctx.fillText(s.cn, pt.x + r + 1, pt.y - r - 1);
    }
  });
  ctx.restore();
}

function captureAR() {
  var video = document.getElementById("arVideo");
  if (!video || !video.videoWidth) { alert("相机还没准备好，稍等一秒再拍"); return; }
  var vw = video.videoWidth, vh = video.videoHeight;
  var c = document.createElement("canvas");
  c.width = vw; c.height = vh;
  var ctx = c.getContext("2d");
  ctx.drawImage(video, 0, 0, vw, vh);
  var k = vw / (video.clientWidth || 640);
  ctx.save();
  ctx.translate(vw / 2, vh / 2);
  ctx.rotate(-skyState.roll * Math.PI / 180);
  ctx.translate(-vw / 2, -vh / 2);
  STARS.forEach(function (s) {
    if (s.raH === null) return;
    var p = getSkyPos(s);
    if (skyState.showOnlyVisible && p.alt < -1) return;
    var pt = projectPoint(p.az, p.alt, vw, vh, 62);
    if (pt.x < -40 || pt.x > vw + 40 || pt.y < -40 || pt.y > vh + 40) return;
    var r = Math.max(3, Math.min(16, (3 - s.mag) * 2.6)) * k * 0.9;
    var hex = colorOf(s.spectral).hex;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
    ctx.fillStyle = hex;
    ctx.shadowColor = hex;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
    if (s.mag < 1.0) {
      ctx.fillStyle = "rgba(255,255,255,.95)";
      ctx.font = Math.round(14 * k) + "px sans-serif";
      ctx.fillText(s.cn, pt.x + r + 2, pt.y - r - 2);
    }
  });
  ctx.restore();
  var url = c.toDataURL("image/png");
  document.getElementById("arCapture").innerHTML =
    '<div class="card"><p class="desc">📷 拍好啦！可以长按图片保存到相册，或点下面按钮下载：</p>'
    + '<img src="' + url + '" style="width:100%;border-radius:10px;margin:8px 0;display:block;">'
    + '<a href="' + url + '" download="星空照片.png"><button style="width:100%">⬇️ 下载照片</button></a></div>';
}

// ================= 手机方向感应 =================
function applyOrientation(alpha, beta, gamma) {
  if (!skyState.follow) return;
  if (alpha === null || alpha === undefined) return;
  skyState.az0 = ((alpha % 360) + 360) % 360;
  var b = beta || 0;
  skyState.alt0 = Math.max(-90, Math.min(90, 90 - b));
  skyState.roll = gamma || 0;
  if (currentView === "sky") renderSky();
}
function onAbsOrient(e) { gotAbs = true; applyOrientation(e.alpha, e.beta, e.gamma); }
function onRelOrient(e) {
  if (e.absolute === true) { gotAbs = true; applyOrientation(e.alpha, e.beta, e.gamma); return; }
  if (gotAbs) return;
  var a = (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) ? e.webkitCompassHeading : e.alpha;
  applyOrientation(a, e.beta, e.gamma);
}
window.addEventListener("deviceorientationabsolute", onAbsOrient);
window.addEventListener("deviceorientation", onRelOrient);

document.addEventListener("pointermove", function (e) {
  if (!dragging || currentView !== "sky") return;
  var dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  lastPX = e.clientX; lastPY = e.clientY;
  if (Math.abs(dx) + Math.abs(dy) > 4) dragMoved = true;
  var w = skyState.cssW, h = skyState.cssH;
  var fovV = skyState.fovH * (h / w);
  skyState.az0 = (skyState.az0 - dx / w * skyState.fovH + 360) % 360;
  skyState.alt0 = Math.max(-90, Math.min(90, skyState.alt0 + dy / h * fovV));
  renderSky();
});
document.addEventListener("pointerup", function () { dragging = false; });

function localInputValue(d) {
  var p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}

function updateSunMoonInfo() {
  var el = document.getElementById("sunMoonInfo");
  if (!el) return;
  if (!skyState.loc) {
    el.textContent = "📍 定位或选择城市后，这里显示日出日落时间和月相";
    return;
  }
  var jd = getSkyJD();
  var st = sunTimes(jd, skyState.loc.lat, skyState.loc.lon);
  var s;
  if (st.polar) s = st.polar === "day" ? "极昼（太阳不落）" : "极夜（太阳不升）";
  else s = "日出 " + fmtHM(st.rise) + " · 日落 " + fmtHM(st.set);
  var ph = moonIllum(jd);
  el.textContent = s + " ｜ 月相：" + ph.name + "（照亮 " + Math.round(ph.k * 100) + "%）";
}

function sunMoonCard(kind) {
  var jd = getSkyJD();
  if (kind === "sun") {
    var body = "我们最近的恒星，白天最亮的星。";
    if (skyState.loc) {
      var st = sunTimes(jd, skyState.loc.lat, skyState.loc.lon);
      body += st.polar ? (st.polar === "day" ? "当前极昼，太阳不落。" : "当前极夜，太阳不升。")
        : ("今天日出 " + fmtHM(st.rise) + "，日落 " + fmtHM(st.set) + "。");
    } else {
      body += "定位或选择城市后可显示日出日落时间。";
    }
    return '<div class="card"><div class="top"><span class="dot" style="background:#ffd166;color:#ffd166"></span>'
      + '<div><h2>太阳</h2><span class="en">Sun</span></div></div><p class="desc">' + body + '</p></div>';
  }
  var ph = moonIllum(jd);
  var body = "照亮 " + Math.round(ph.k * 100) + "%" + "，月龄 " + ph.age.toFixed(1) + " 天。";
  body += ph.k < 0.02 ? "今天前后是新月。" : (ph.k > 0.98 ? "今天前后是满月！" : "");
  return '<div class="card"><div class="top"><span class="dot" style="background:#dfe6f5;color:#dfe6f5"></span>'
    + '<div><h2>月亮</h2><span class="en">Moon · ' + ph.name + '</span></div></div><p class="desc">' + body + '</p></div>';
}

function bgStarCard(b) {
  var con = CON_CN[b[3]] || b[3] || "未知";
  return '<div class="card"><div class="top"><span class="dot" style="background:#8fa3d8;color:#8fa3d8"></span>'
    + '<div><h2>HIP ' + b[4] + '</h2><span class="en">真实星表亮星</span>'
    + '<div class="meta"><span class="tag">星座：' + con + '</span><span class="tag">星等：' + b[2] + '</span></div>'
    + '</div></div><p class="desc">来自依巴谷卫星星表（Hipparcos）的真实数据。</p></div>';
}

function locateStarByName(name) {
  var s = null;
  STARS.forEach(function (x) { if (x.name === name) s = x; });
  if (!s) return;
  skyState.targetStar = s;
  skyState.follow = false;
  var p = getSkyPos(s);
  skyState.az0 = p.az;
  skyState.alt0 = p.alt;
  skyState.fovH = 45;
  setTab("sky");
  var d = document.getElementById("skyDetail");
  if (d) {
    var note = p.alt < 0 ? '<p class="legend">🌑 此刻它在地平线以下（已强制显示，黄色圈标注）</p>'
                         : '<p class="legend">⭐ 已定位到这颗星（黄色圈标注）</p>';
    d.innerHTML = starCard(s) + note;
  }
}

function drawSkySeg(ctx, seg, w, h, okVisible) {
  var a = getSkyPos({ raH: seg[0][0], dec: seg[0][1] });
  var b = getSkyPos({ raH: seg[1][0], dec: seg[1][1] });
  if (!okVisible(a.alt) && !okVisible(b.alt)) return;
  var pa = projectPoint(a.az, a.alt, w, h, skyState.fovH);
  var pb = projectPoint(b.az, b.alt, w, h, skyState.fovH);
  if (Math.abs(pa.x - pb.x) > w * 0.8) return;
  if ((pa.x < -40 && pb.x < -40) || (pa.x > w + 40 && pb.x > w + 40)) return;
  if ((pa.y < -40 && pb.y < -40) || (pa.y > h + 40 && pb.y > h + 40)) return;
  ctx.beginPath();
  ctx.moveTo(pa.x, pa.y);
  ctx.lineTo(pb.x, pb.y);
  ctx.stroke();
}

function renderView() {
  if (currentView === "search") renderSearch();
  else if (currentView === "constellation") renderConstellation();
  else if (currentView === "season") renderSeason();
  else if (currentView === "rank") renderRank();
  else if (currentView === "all") renderAll();

  else if (currentView === "map") renderMap();
}

function setTab(view) {

    arStream.getTracks().forEach(function (t) { t.stop(); });
    arStream = null;
  }
  currentView = view;
  tabs.forEach(function (t) {
    t.classList.toggle("active", t.getAttribute("data-view") === view);
  });
  renderView();
}

tabs.forEach(function (t) {

});

document.getElementById("luckyBtn").addEventListener("click", function () {
