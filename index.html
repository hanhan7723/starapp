var PLANETS = [{"cn":"水星","en":"Mercury","type":"类地行星","story":"水星绕太阳一圈只要 88 天，是跑得最快的行星。古罗马人把它和脚上生翼、来去如风的信使之神墨丘利（Mercury）联系在一起，便以他命名。中文名来自五行学说——它颜色灰白，古人觉得像流动的水银。","fun":"水星几乎没有大气保温，昼夜温差接近 600°C，是太阳系温差最大的行星。","credit":"NASA · MESSENGER（第一张轨道彩色全貌图）","diameter":4879,"diaVs":"0.38","massVs":"0.055","distAU":"0.39","distText":"5,790 万 km","orbit":"88 天","rotation":"58.6 天","moons":"0 颗","temp":"-173 ~ 427°C","atmosphere":"几乎没有大气","imgCard":"https://images-assets.nasa.gov/image/GSFC_20171208_Archive_e001922/GSFC_20171208_Archive_e001922~medium.jpg","imgDetail":"https://images-assets.nasa.gov/image/GSFC_20171208_Archive_e001922/GSFC_20171208_Archive_e001922~large.jpg","imgPage":"https://images.nasa.gov/details/GSFC_20171208_Archive_e001922"},{"cn":"金星","en":"Venus","type":"类地行星","story":"金星是夜空中除月亮外最亮的星，如宝石般闪耀。罗马人以爱与美之神维纳斯（Venus）命名它。中国人则按它出现的时间叫它：清晨的启明星，黄昏的长庚星。","fun":"金星是太阳系最热的行星——比离太阳更近的水星还热，罪魁祸首是失控的温室效应；而且它自转方向与多数行星相反，太阳从西边升起。","credit":"NASA · Magellan 雷达全球视图","diameter":12104,"diaVs":"0.95","massVs":"0.82","distAU":"0.72","distText":"1.08 亿 km","orbit":"225 天","rotation":"243 天（逆向）","moons":"0 颗","temp":"平均约 465°C","atmosphere":"浓密 CO₂ + 硫酸云","imgCard":"https://images-assets.nasa.gov/image/S91-50688/S91-50688~medium.jpg","imgDetail":"https://images-assets.nasa.gov/image/S91-50688/S91-50688~large.jpg","imgPage":"https://images.nasa.gov/details/S91-50688"},{"cn":"地球","en":"Earth","type":"类地行星","story":"Earth 源自古英语 eorþe，意思是「大地、土壤」。这是唯一不以神命名的行星——古人把神的名字给了天上的星星，把脚下的土地留给了自己。","fun":"地球是目前已知唯一存在生命的星球；表面 71% 被海洋覆盖。","credit":"NASA · 阿波罗 17 号「蓝色大理石」","diameter":12742,"diaVs":"1","massVs":"1","distAU":"1","distText":"1.5 亿 km","orbit":"365.25 天","rotation":"24 小时","moons":"1 颗（月球）","temp":"平均约 15°C","atmosphere":"氮气 + 氧气","imgCard":"https://images-assets.nasa.gov/image/GSFC_20171208_Archive_e000496/GSFC_20171208_Archive_e000496~medium.jpg","imgDetail":"https://images-assets.nasa.gov/image/GSFC_20171208_Archive_e000496/GSFC_20171208_Archive_e000496~large.jpg","imgPage":"https://images.nasa.gov/details/GSFC_20171208_Archive_e000496"},{"cn":"火星","en":"Mars","type":"类地行星","story":"火星表面因氧化铁（铁锈）而发红，古人联想到鲜血与战争，便以罗马战神玛尔斯（Mars）命名。中文名「火星」同样取自它如火一般的红色。","fun":"火星拥有太阳系最高峰——奥林帕斯火山（约 22 km，接近 3 个珠穆朗玛峰）；它也是人类探测器到访最多的行星。","credit":"NASA · 哈勃望远镜全球视图","diameter":6779,"diaVs":"0.53","massVs":"0.11","distAU":"1.52","distText":"2.28 亿 km","orbit":"687 天","rotation":"24.6 小时","moons":"2 颗（火卫一、火卫二）","temp":"平均约 -63°C","atmosphere":"稀薄 CO₂","imgCard":"https://images-assets.nasa.gov/image/PIA01588/PIA01588~medium.jpg","imgDetail":"https://images-assets.nasa.gov/image/PIA01588/PIA01588~large.jpg","imgPage":"https://images.nasa.gov/details/PIA01588"},{"cn":"木星","en":"Jupiter","type":"气态巨行星","story":"木星是太阳系最大的行星，质量比其余七颗行星加起来还大 2.5 倍。罗马人把它献给众神之王朱庇特（Jupiter），再合适不过。","fun":"大红斑是一场持续了数百年的超级风暴，宽得能装下整个地球；木星自转是行星中最快的，一天不到 10 小时。","credit":"NASA · 朱诺号探测器","diameter":139820,"diaVs":"11.2","massVs":"318","distAU":"5.20","distText":"7.78 亿 km","orbit":"11.86 年","rotation":"9.9 小时","moons":"95 颗","temp":"平均约 -110°C","atmosphere":"氢气 + 氦气","imgCard":"https://images-assets.nasa.gov/image/PIA21376/PIA21376~medium.jpg","imgDetail":"https://images-assets.nasa.gov/image/PIA21376/PIA21376~large.jpg","imgPage":"https://images.nasa.gov/details/PIA21376"},{"cn":"土星","en":"Saturn","type":"气态巨行星","story":"土星以罗马农神萨图恩（Saturn，朱庇特之父）命名。它是肉眼可见的最远行星，运动缓慢，古人觉得像一位年迈的时间之神。","fun":"土星环由无数冰块与碎石组成，直径数十万公里，厚度却只有几十米；土星的平均密度比水还小，理论上能浮在水面上。","credit":"NASA · 卡西尼号探测器","diameter":116460,"diaVs":"9.4","massVs":"95","distAU":"9.58","distText":"14.3 亿 km","orbit":"29.4 年","rotation":"10.7 小时","moons":"146 颗","temp":"平均约 -140°C","atmosphere":"氢气 + 氦气","imgCard":"https://images-assets.nasa.gov/image/PIA06193/PIA06193~medium.jpg","imgDetail":"https://images-assets.nasa.gov/image/PIA06193/PIA06193~large.jpg","imgPage":"https://images.nasa.gov/details/PIA06193"},{"cn":"天王星","en":"Uranus","type":"冰巨行星","story":"1781 年赫歇尔用望远镜发现了天王星——第一颗被「发现」的行星。它是唯一以希腊神（乌拉诺斯，天空之神）而非罗马神命名的行星；中文名在五行之外，译作「天王」。","fun":"天王星是「躺着」自转的——自转轴几乎躺在公转轨道面上（倾斜约 98°），像一颗在轨道上滚动的球。","credit":"NASA · 旅行者 2 号","diameter":50724,"diaVs":"4.0","massVs":"14.5","distAU":"19.2","distText":"28.7 亿 km","orbit":"84 年","rotation":"17.2 小时","moons":"28 颗","temp":"平均约 -195°C","atmosphere":"氢、氦 + 甲烷","imgCard":"https://images-assets.nasa.gov/image/PIA18182/PIA18182~medium.jpg","imgDetail":"https://images-assets.nasa.gov/image/PIA18182/PIA18182~large.jpg","imgPage":"https://images.nasa.gov/details/PIA18182"},{"cn":"海王星","en":"Neptune","type":"冰巨行星","story":"海王星是第一颗「用笔算出来」的行星：天文学家发现天王星轨道异常，勒维耶用数学预言了未知行星的位置，1846 年伽勒按图索骥找到了它。深邃的蓝色让它获得海神尼普顿（Neptune）之名。","fun":"海王星上刮着太阳系最快的风（超过 2,000 km/h）；它自 1846 年被发现，直到 2011 年才绕太阳转完第一圈。","credit":"NASA · 旅行者 2 号","diameter":49244,"diaVs":"3.9","massVs":"17","distAU":"30.1","distText":"45 亿 km","orbit":"165 年","rotation":"16.1 小时","moons":"16 颗","temp":"平均约 -200°C","atmosphere":"氢、氦 + 甲烷","imgCard":"https://images-assets.nasa.gov/image/PIA02210/PIA02210~medium.jpg","imgDetail":"https://images-assets.nasa.gov/image/PIA02210/PIA02210~large.jpg","imgPage":"https://images.nasa.gov/details/PIA02210"}];

// ================= 纯逻辑函数 =================
var COLOR_NAME = {O: "蓝色", B: "蓝白色", A: "白色", F: "黄白色", G: "黄色", K: "橙色", M: "红色"};
var COLOR_HEX  = {O: "#9bb0ff", B: "#aabfff", A: "#cad7ff", F: "#f8f7ff", G: "#fff4ea", K: "#ffd2a1", M: "#ffcc6f"};

function colorOf(sp) {
  var first = String(sp).charAt(0);
  return { name: COLOR_NAME[first] || "未知", hex: COLOR_HEX[first] || "#ffffff" };
}
function distText(s) {
  return s.distLy < 0.01 ? "约 1.5 亿千米（8.3 光分）" : s.distLy + " 光年";
}
function searchStars(kw) {
  kw = (kw || "").trim().toLowerCase();
  if (!kw) return [];
  return STARS.filter(function (s) {
    return s.name.toLowerCase().indexOf(kw) >= 0 || s.cn.indexOf(kw) >= 0
        || s.constellation.toLowerCase().indexOf(kw) >= 0 || s.cnConst.indexOf(kw) >= 0;
  });
}
function byConstellation(kw) {
  kw = (kw || "").trim().toLowerCase();
  return STARS.filter(function (s) {
    return s.cnConst.toLowerCase().indexOf(kw) >= 0 || s.constellation.toLowerCase().indexOf(kw) >= 0;
  });
}
function bySeason(se) { return STARS.filter(function (s) { return s.season === se; }); }
function rankedStars(n) {
  return STARS.filter(function (s) { return !s.isSun; })
              .sort(function (a, b) { return a.mag - b.mag; })
              .slice(0, n);
}
function allStars() { return STARS.slice().sort(function (a, b) { return a.mag - b.mag; }); }
function constellations() {
  var m = {};
  STARS.forEach(function (s) { m[s.cnConst] = 1; });
  return Object.keys(m);
}
function seasons() {
  var m = {};
  STARS.forEach(function (s) { m[s.season] = 1; });
  return Object.keys(m);
}

// ================= 天文计算（定位 + 时间 -> 每颗星的高度角/方位角） =================
function nowJD() { return Date.now() / 86400000 + 2440587.5; }

function gmstDeg(jd) {
  var d = jd - 2451545.0;
  return ((280.46061837 + 360.98564736629 * d) % 360 + 360) % 360;
}

function normalizeAz(a) {
  a = a % 360;
  if (a > 180) a -= 360;
  if (a <= -180) a += 360;
  return a;
}

function starAltAz(s, latDeg, lonDeg, jd) {
  var raDeg = s.raH * 15;
  var lst = ((gmstDeg(jd) + lonDeg) % 360 + 360) % 360;
  var H = (lst - raDeg) * Math.PI / 180;
  var ph = latDeg * Math.PI / 180;
  var de = s.dec * Math.PI / 180;
  var sinAlt = Math.sin(ph) * Math.sin(de) + Math.cos(ph) * Math.cos(de) * Math.cos(H);
  var alt = Math.asin(Math.max(-1, Math.min(1, sinAlt))) * 180 / Math.PI;
  var az = (Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(ph) - Math.tan(de) * Math.cos(ph)) + Math.PI) * 180 / Math.PI;
  az = ((az % 360) + 360) % 360;
  return { alt: alt, az: az };
}
// ================= 太阳 / 月亮 =================
var D2R = Math.PI / 180;

function sunRaDec(jd) {
  var n = jd - 2451545.0;
  var L = ((280.460 + 0.9856474 * n) % 360 + 360) % 360;
  var g = ((357.528 + 0.9856003 * n) % 360 + 360) % 360 * D2R;
  var lam = ((L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) % 360 + 360) % 360;
  var eps = (23.439 - 0.0000004 * n) * D2R;
  var la = lam * D2R;
  var ra = Math.atan2(Math.cos(eps) * Math.sin(la), Math.cos(la));
  var dec = Math.asin(Math.sin(eps) * Math.sin(la));
  return { raH: ((ra / D2R / 15) % 24 + 24) % 24, dec: dec / D2R, lam: lam };
}

function moonRaDec(jd) {
  var n = jd - 2451545.0;              // 距离 J2000.0 的天数
  var T = n / 36525;                   // 仅用于黄赤交角小项
  var Lp = ((218.316 + 13.176396 * n) % 360 + 360) % 360;
  var D = ((297.850 + 12.190749 * n) % 360 + 360) % 360;
  var M = ((357.529 + 0.985600 * n) % 360 + 360) % 360;
  var Mp = ((134.963 + 13.064993 * n) % 360 + 360) % 360;
  var F = ((93.272 + 13.229350 * n) % 360 + 360) % 360;
  var lam = Lp + 6.289 * Math.sin(Mp * D2R) + 1.274 * Math.sin((2 * D - Mp) * D2R)
          + 0.658 * Math.sin(2 * D * D2R) + 0.214 * Math.sin(2 * Mp * D2R) - 0.186 * Math.sin(M * D2R);
  var bet = 5.128 * Math.sin(F * D2R);
  var eps = (23.439291 - 0.0130042 * T) * D2R;
  var la = lam * D2R, be = bet * D2R;
  var dec = Math.asin(Math.sin(be) * Math.cos(eps) + Math.cos(be) * Math.sin(eps) * Math.sin(la));
  var ra = Math.atan2(Math.sin(la) * Math.cos(eps) - Math.tan(be) * Math.sin(eps), Math.cos(la));
  return { raH: ((ra / D2R / 15) % 24 + 24) % 24, dec: dec / D2R, lam: lam };
}

function moonIllum(jd) {
  var sm = sunRaDec(jd);
  var mm = moonRaDec(jd);
  var dlam = ((mm.lam - sm.lam) % 360 + 360) % 360;
  var k = (1 - Math.cos(dlam * D2R)) / 2;
  var age = dlam / 360 * 29.53059;
  var name;
  if (age < 1.85 || age >= 27.68) name = "新月";
  else if (age < 5.54) name = "娥眉月";
  else if (age < 9.23) name = "上弦月";
  else if (age < 12.92) name = "盈凸月";
  else if (age < 16.61) name = "满月";
  else if (age < 20.30) name = "亏凸月";
  else if (age < 23.99) name = "下弦月";
  else name = "残月";
  return { k: k, age: age, name: name };
}

function sunTimes(jd, lat, lon) {
  var sd = sunRaDec(jd);
  var n = jd - 2451545.0;
  var g = ((357.528 + 0.9856003 * n) % 360 + 360) % 360 * D2R;
  var eotMin = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
             - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  var ph = lat * D2R, de = sd.dec * D2R;
  var cosH0 = (Math.sin(-0.833 * D2R) - Math.sin(ph) * Math.sin(de)) / (Math.cos(ph) * Math.cos(de));
  if (cosH0 < -1) return { polar: "day" };
  if (cosH0 > 1) return { polar: "night" };
  var H0 = Math.acos(cosH0) / D2R / 15;
  var tzH = -new Date().getTimezoneOffset() / 60;
  var noon = 12 + (tzH * 15 - lon) / 15 + eotMin / 60;
  return { rise: noon - H0, set: noon + H0 };
}

function fmtHM(h) {
  h = ((h % 24) + 24) % 24;
  var hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  if (mm === 60) { hh = (hh + 1) % 24; mm = 0; }
  return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
}

  var input = document.getElementById("kw");
  var results = document.getElementById("results");
  function update() {
    var list = searchStars(input.value);
    results.innerHTML = list.length ? list.map(starCard).join("") : emptyMsg("没找到相关星星，换个关键词试试～");
  }
  input.addEventListener("input", update);
  input.focus();
  update();
}

function renderConstellation() {
  content.innerHTML = '<div class="chips">' + constellations().map(function (c) {
    return '<button class="chip">' + c + '</button>';
  }).join("") + '</div><div id="res"></div>';
  var res = document.getElementById("res");
  res.innerHTML = emptyMsg("点击上面的星座，查看里面的星星");
  content.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      content.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
      chip.classList.add("active");
      res.innerHTML = byConstellation(chip.textContent).map(starCard).join("");
    });
  });
}

function renderSeason() {
  content.innerHTML = '<div class="chips">' + seasons().map(function (se) {
    return '<button class="chip">' + se + '</button>';
  }).join("") + '</div><div id="res"></div>';
  var res = document.getElementById("res");
  res.innerHTML = emptyMsg("点击上面的季节，查看适合观测的星星");
  content.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      content.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
      chip.classList.add("active");
      res.innerHTML = bySeason(chip.textContent).map(starCard).join("");
    });
  });
}

function renderRank() {
  content.innerHTML = '<div class="chips">' + [5, 10, 20, 30].map(function (n) {
    return '<button class="chip' + (n === rankN ? " active" : "") + '" data-n="' + n + '">Top ' + n + '</button>';
  }).join("") + '</div><div id="res"></div>';
  var res = document.getElementById("res");
  content.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      rankN = parseInt(chip.getAttribute("data-n"), 10);
      renderRank();
    });
  });
  currentList = rankedStars(rankN);
  res.innerHTML = currentList.map(rowHtml).join("");
  bindRows();
}

function renderAll() {
  currentList = allStars();
  content.innerHTML = '<div class="hint">共 ' + currentList.length + ' 颗（按亮度排序，点击查看详情）</div><div id="res"></div>';
  document.getElementById("res").innerHTML = currentList.map(rowHtml).join("");
  bindRows();
}

function renderMap() {
  content.innerHTML = '<canvas id="map"></canvas>'
    + '<div class="legend">全天星图（赤经×赤纬）· 88 星座连线 + ' + BG_N + ' 颗真实星表星 · 点击查看详情</div>'
    + '<div id="mapDetail"></div>';
  var canvas = document.getElementById("map");
  var w = Math.min(720, Math.max(320, content.clientWidth));
  var h = Math.round(w * 0.55);
  var dpr = window.devicePixelRatio || 1;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.style.margin = "0 auto";
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  var ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#0b0f2b";
  ctx.fillRect(0, 0, w, h);

  function mxy(raH, dec) { return { x: w - (raH / 24) * w, y: (90 - dec) / 180 * h }; }

  ctx.strokeStyle = "rgba(140,160,255,0.12)";
  ctx.lineWidth = 1;
  [-60, -30, 0, 30, 60].forEach(function (d) {
    var y = (90 - d) / 180 * h;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  });
  [0, 6, 12, 18, 24].forEach(function (ra) {
    var x = w - (ra / 24) * w;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  });

  ctx.fillStyle = "rgba(185,200,255,0.08)";
  ctx.beginPath();
  GALAXY_BAND.north.forEach(function (p, i2) {
    var gpt = mxy(p[0], p[1]);
    if (i2 === 0) ctx.moveTo(gpt.x, gpt.y); else ctx.lineTo(gpt.x, gpt.y);
  });
  for (var gi = GALAXY_BAND.south.length - 1; gi >= 0; gi--) {
    var gpt2 = mxy(GALAXY_BAND.south[gi][0], GALAXY_BAND.south[gi][1]);
    ctx.lineTo(gpt2.x, gpt2.y);
  }
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "rgba(150,170,255,0.25)";
  ctx.lineWidth = 1;
  Object.keys(CON_LINES).forEach(function (cid) {
    CON_LINES[cid].forEach(function (seg) {
      var a = mxy(seg[0][0], seg[0][1]), b = mxy(seg[1][0], seg[1][1]);
      if (Math.abs(a.x - b.x) > w * 0.8) return;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    });
  });

  var pts = [];
  MESSIER.forEach(function (m) {
    var p = mxy(m.raH, m.dec);
    var s2 = 4;
    ctx.strokeStyle = "#9be8ff";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(p.x - s2, p.y); ctx.lineTo(p.x, p.y - s2);
    ctx.lineTo(p.x + s2, p.y); ctx.lineTo(p.x, p.y + s2);
    ctx.closePath();
    ctx.stroke();
    pts.push({ dso: m, x: p.x, y: p.y, r: 8 });
  });
  for (var bi = 0; bi < BG_N; bi++) {
    if (BG_MAG[bi] > 4.6) continue;
    var p = mxy(BG_RAH[bi], BG_DEC[bi]);
    var r = Math.max(0.7, Math.min(3.5, (4.6 - BG_MAG[bi]) * 0.8));
    ctx.fillStyle = "rgba(205,218,255,0.7)";
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    pts.push({ bgI: bi, x: p.x, y: p.y, r: Math.max(r, 4) });
  }

  STARS.forEach(function (s) {
    if (s.raH === null || s.raH === undefined) return;
    var p = mxy(s.raH, s.dec);
    var r = Math.max(3, Math.min(15, (3 - s.mag) * 2.4));
    var hex = colorOf(s.spectral).hex;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = hex;
    ctx.shadowColor = hex;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 0.5;
    ctx.stroke();
    pts.push({ s: s, x: p.x, y: p.y, r: r });
  });

  rankedStars(12).forEach(function (s) {
    var p = null;
    for (var i = 0; i < pts.length; i++) { if (pts[i].s && pts[i].s.name === s.name) { p = pts[i]; break; } }
    if (!p) return;
    ctx.fillStyle = "#cdd4f5";
    ctx.font = "10px sans-serif";
    ctx.fillText(s.cn, p.x + p.r + 2, p.y - p.r - 2);
  });

  ctx.fillStyle = "rgba(200,210,255,0.55)";
  ctx.font = "10px sans-serif";
  ctx.fillText("赤经 12h", w / 2 - 16, 12);
  ctx.fillText("24h", 6, 12);
  ctx.fillText("赤纬 0°", 6, h / 2 + 12);

  canvas.onclick = function (e) {
    var rect = canvas.getBoundingClientRect();
    var px = (e.clientX - rect.left) * (w / rect.width);
    var py = (e.clientY - rect.top) * (h / rect.height);
    var best = null, bd = 1e9;
    pts.forEach(function (p) {
      var d = Math.sqrt((px - p.x) * (px - p.x) + (py - p.y) * (py - p.y));
      if (d < bd) { bd = d; best = p; }
    });
    if (!best) return;
    if (best.s && bd <= best.r + 12) document.getElementById("mapDetail").innerHTML = starCard(best.s);
    else if (best.bgI !== undefined && bd <= 14) document.getElementById("mapDetail").innerHTML = bgStarCard(best.bgI);
    else if (best.dso && bd <= 14) document.getElementById("mapDetail").innerHTML = dsoCard(best.dso);
  };
}

// ================= 星空 360° 模式 =================
function getSkyJD() {
  return skyState.customJD || nowJD();
}

function getSkyPos(s) {
  if (skyState.loc) {
    return starAltAz(s, skyState.loc.lat, skyState.loc.lon, getSkyJD());
  }
  return { alt: s.dec, az: ((s.raH * 15) % 360 + 360) % 360 };
}

function projectPoint(az, alt, w, h, fovH) {
  var fovV = fovH * (h / w);
  var dx = normalizeAz(az - skyState.az0) / fovH * w;
  var dy = -(alt - skyState.alt0) / fovV * h;
  return { x: w / 2 + dx, y: h / 2 + dy };
}

function renderSky(ts) {
  var canvas = document.getElementById("skyCanvas");
  if (!canvas) return;
  ts = ts || Date.now();
  var w = skyState.cssW, h = skyState.cssH;
  var dpr = window.devicePixelRatio || 1;
  var ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  var g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#05081c");
  g.addColorStop(0.6, "#0a0f2e");
  g.addColorStop(1, "#101a38");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.translate(w / 2, h / 2);
  if (skyState.roll) ctx.rotate(-skyState.roll * Math.PI / 180);
  ctx.translate(-w / 2, -h / 2);

  function okVisible(alt) { return !skyState.showOnlyVisible || alt >= -1; }
  var skyJD = getSkyJD();
  var loc0 = skyState.loc;

  if (skyState.showGalaxy) {
    ctx.fillStyle = "rgba(185,200,255,0.07)";
    ctx.strokeStyle = "rgba(185,200,255,0.10)";
    ctx.lineWidth = 1;
    var ptsG = [];
    GALAXY_BAND.north.forEach(function (p) {
      var gp = getSkyPos({ raH: p[0], dec: p[1] });
      ptsG.push(projectPoint(gp.az, gp.alt, w, h, skyState.fovH));
    });
    for (var gi = GALAXY_BAND.south.length - 1; gi >= 0; gi--) {
      var sp = GALAXY_BAND.south[gi];
      var gp2 = getSkyPos({ raH: sp[0], dec: sp[1] });
      ptsG.push(projectPoint(gp2.az, gp2.alt, w, h, skyState.fovH));
    }
    ctx.beginPath();
    var gStarted = false;
    for (var pi = 0; pi < ptsG.length; pi++) {
      var gpt = ptsG[pi];
      var gprev = ptsG[(pi - 1 + ptsG.length) % ptsG.length];
      if (Math.abs(gpt.x - gprev.x) > w * 0.8) { gStarted = false; continue; }
      if (!gStarted) { ctx.moveTo(gpt.x, gpt.y); gStarted = true; }
      else ctx.lineTo(gpt.x, gpt.y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  skySegHits = [];
  if (skyState.showLines) {
    ctx.strokeStyle = "rgba(150,170,255,0.28)";
    ctx.lineWidth = 1;
    Object.keys(CON_LINES).forEach(function (cid) {
      CON_LINES[cid].forEach(function (seg) { drawSkySeg(ctx, seg, w, h, okVisible, cid); });
    });
    ctx.strokeStyle = "rgba(190,210,255,0.22)";
    ASTERISMS.forEach(function (as) {
      as.segs.forEach(function (seg) { drawSkySeg(ctx, seg, w, h, okVisible, as.name); });
    });
  }

  var pts = [];
  var lodMag = 2.0 + skyState.fovH / 30;
  var scr = skyScratch;
  for (var bi = 0; bi < BG_N; bi++) {
    var bmag = BG_MAG[bi];
    if (bmag > lodMag) continue;
    rawAltAz(BG_RAH[bi], BG_DEC[bi], skyJD, loc0, scr);
    if (!okVisible(scr.alt)) continue;
    var bpt = projectPoint(scr.az, scr.alt, w, h, skyState.fovH);
    if (bpt.x < -20 || bpt.x > w + 20 || bpt.y < -20 || bpt.y > h + 20) continue;
    var br = Math.max(0.7, Math.min(3.5, (4.6 - bmag) * 0.8));
    var tw = 0.7 + 0.3 * Math.sin(ts / 900 + bi * 1.7);
    ctx.fillStyle = "rgba(205,218,255," + (0.3 + 0.5 * tw) + ")";
    ctx.beginPath();
    ctx.arc(bpt.x, bpt.y, br, 0, Math.PI * 2);
    ctx.fill();
    pts.push({ bgI: bi, x: bpt.x, y: bpt.y, r: Math.max(br, 5) });
  }

  STARS.forEach(function (s) {
    if (s.raH === null || s.raH === undefined) return;
    var p = getSkyPos(s);
    if (!okVisible(p.alt) && s !== skyState.targetStar) return;
    var pt = projectPoint(p.az, p.alt, w, h, skyState.fovH);
    if (pt.x < -30 || pt.x > w + 30 || pt.y < -30 || pt.y > h + 30) return;
    var r = Math.max(2, Math.min(12, (3 - s.mag) * 2.2));
    var hex = colorOf(s.spectral).hex;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
    ctx.fillStyle = hex;
    ctx.shadowColor = hex;
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;
    if (s.mag < 1.5 && skyState.fovH < 50) {
      ctx.fillStyle = "#cdd4f5";
      ctx.font = "10px sans-serif";
      ctx.fillText(s.cn, pt.x + r + 1, pt.y - r - 1);
    }
    pts.push({ s: s, x: pt.x, y: pt.y, r: r });
  });

  if (skyState.showDso) {
    MESSIER.forEach(function (m) {
      var mp = getSkyPos({ raH: m.raH, dec: m.dec });
      if (!okVisible(mp.alt)) return;
      var mt = projectPoint(mp.az, mp.alt, w, h, skyState.fovH);
      if (mt.x < -20 || mt.x > w + 20 || mt.y < -20 || mt.y > h + 20) return;
      var s2 = 4;
      ctx.strokeStyle = "#9be8ff";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(mt.x - s2, mt.y); ctx.lineTo(mt.x, mt.y - s2);
      ctx.lineTo(mt.x + s2, mt.y); ctx.lineTo(mt.x, mt.y + s2);
      ctx.closePath();
      ctx.stroke();
      if (m.mag < 6.5 && skyState.fovH < 60) {
        ctx.fillStyle = "#b8eaff";
        ctx.font = "10px sans-serif";
        ctx.fillText(m.id, mt.x + s2 + 2, mt.y - s2 - 1);
      }
      pts.push({ dso: m, x: mt.x, y: mt.y, r: 8 });
    });
  }

  var jd = getSkyJD();
  var sunD = sunRaDec(jd);
  var moonD = moonRaDec(jd);
  var items = [];
  if (skyState.showSun) items.push({ kind: "sun", raH: sunD.raH, dec: sunD.dec });
  if (skyState.showMoon) items.push({ kind: "moon", raH: moonD.raH, dec: moonD.dec });
  for (var ii = 0; ii < items.length; ii++) {
    var it = items[ii];
    var ip = getSkyPos({ raH: it.raH, dec: it.dec });
    var ipt = projectPoint(ip.az, ip.alt, w, h, skyState.fovH);
    if (ipt.x < -40 || ipt.x > w + 40 || ipt.y < -40 || ipt.y > h + 40) continue;
    if (it.kind === "sun") {
      ctx.fillStyle = "#ffd166";
      ctx.shadowColor = "#ffd166";
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(ipt.x, ipt.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#ffe9b3";
      ctx.font = "11px sans-serif";
      ctx.fillText("太阳", ipt.x + 11, ipt.y + 4);
      pts.push({ sun: true, x: ipt.x, y: ipt.y, r: 12 });
    } else {
      var ph = moonIllum(jd);
      var r2 = 7;
      ctx.fillStyle = "#dfe6f5";
      ctx.beginPath();
      ctx.arc(ipt.x, ipt.y, r2, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.arc(ipt.x, ipt.y, r2, 0, Math.PI * 2);
      ctx.clip();
      var dir = ph.age < 14.77 ? -1 : 1;
      ctx.fillStyle = "#2e3557";
      ctx.beginPath();
      ctx.arc(ipt.x + dir * 2 * r2 * (1 - ph.k), ipt.y, r2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.arc(ipt.x, ipt.y, r2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "#cdd4f5";
      ctx.font = "11px sans-serif";
      ctx.fillText("月亮", ipt.x + 10, ipt.y + 4);
      pts.push({ moon: true, x: ipt.x, y: ipt.y, r: 11 });
    }
  }

  if (!skyState.meteorNext) skyState.meteorNext = ts + 4000;
  if (!skyState.meteor && ts >= skyState.meteorNext) {
    var mx = Math.random() * w, my = Math.random() * h * 0.55;
    var len = 60 + Math.random() * 80;
    var ang = Math.PI / 4 + (Math.random() - 0.5) * 0.9;
    skyState.meteor = { x: mx, y: my, dx: Math.cos(ang) * len, dy: Math.sin(ang) * len, t0: ts };
    skyState.meteorNext = ts + 4500 + Math.random() * 7000;
  }
  if (skyState.meteor) {
    var mage = ts - skyState.meteor.t0;
    if (mage > 900) skyState.meteor = null;
    else {
      var mm = skyState.meteor, mk = mage / 900;
      var g2 = ctx.createLinearGradient(mm.x - mm.dx, mm.y - mm.dy, mm.x, mm.y);
      g2.addColorStop(0, "rgba(255,255,255,0)");
      g2.addColorStop(1, "rgba(255,255,255," + (0.9 * (1 - mk)) + ")");
      ctx.strokeStyle = g2;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(mm.x - mm.dx * (1 - mk), mm.y - mm.dy * (1 - mk));
      ctx.lineTo(mm.x, mm.y);
      ctx.stroke();
    }
  }

  if (skyState.targetStar) {
    for (var ti = 0; ti < pts.length; ti++) {
      var tp = pts[ti];
      if (tp.s && tp.s.name === skyState.targetStar.name) {
        ctx.strokeStyle = "#ffd166";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, tp.r + 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(tp.x - tp.r - 12, tp.y); ctx.lineTo(tp.x - tp.r - 4, tp.y);
        ctx.moveTo(tp.x + tp.r + 4, tp.y); ctx.lineTo(tp.x + tp.r + 12, tp.y);
        ctx.moveTo(tp.x, tp.y - tp.r - 12); ctx.lineTo(tp.x, tp.y - tp.r - 4);
        ctx.moveTo(tp.x, tp.y + tp.r + 4); ctx.lineTo(tp.x, tp.y + tp.r + 12);
        ctx.stroke();
      }
    }
  }

  ctx.restore();
  skyPts = pts;
  updateSkyInfo();
  updateSunMoonInfo();
}

function updateSkyInfo() {
  var el = document.getElementById("skyInfo");
  if (!el) return;
  var t = skyState.customJD ? new Date((skyState.customJD - 2440587.5) * 86400000) : new Date();
  var lst = skyState.loc ? (gmstDeg(getSkyJD()) + skyState.loc.lon) % 360 : gmstDeg(getSkyJD());
  var txt = t.toLocaleTimeString();
  if (skyState.customJD) txt += "（自定义）";
  txt += " ｜ 恒星时 " + lst.toFixed(1) + "°";
  if (skyState.loc) {
    if (skyState.cityName) txt += " ｜ " + skyState.cityName;
    else txt += " ｜ " + skyState.loc.lat.toFixed(1) + "°N, " + skyState.loc.lon.toFixed(1) + "°E" + (skyState.loc.fallback ? "（默认）" : "");
  } else {
    txt += " ｜ 未定位，先按赤道坐标显示";
  }
  txt += " ｜ 视角：方位 " + Math.round(skyState.az0) + "° 高度 " + Math.round(skyState.alt0) + "°";
  var vis = STARS.filter(function (s) {
    return s.raH !== null && getSkyPos(s).alt > -1;
  }).length;
  txt += " ｜ 亮星可见 " + vis + " 颗";
  el.textContent = "拖动画面转动视角 · 点击星星看详情 ｜ " + txt;
}

function skyHint(msg) {
  var el = document.getElementById("skyInfo");
  if (el) el.textContent = msg;
}

function setFollow(on) {
  skyState.follow = on;
  var chip = document.getElementById("skyFollow");
  if (chip) {
    chip.textContent = on ? "🧭 跟随中…" : "🧭 跟随手机方向";
    chip.classList.toggle("active", on);
  }
  if (!on) return;
  if (typeof DeviceOrientationEvent !== "undefined"
      && typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission().then(function (r) {
      if (r === "granted") {
        skyHint("已开启！举起手机朝天空转动试试");
      } else {
        setFollow(false);
        skyHint("需要方向权限才能跟随，或直接用拖动浏览");
      }
    }).catch(function () {
      setFollow(false);
      skyHint("方向权限被拒绝，用拖动浏览吧");
    });
  } else if (typeof window.DeviceOrientationEvent === "undefined") {
    setFollow(false);
    skyHint("此设备不支持方向感应，试试拖动浏览（电脑上按住鼠标拖）");
  } else {
    skyHint("已开启！举起手机朝天空转动试试 🧭");
  }
}

function tryLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function (pos) {
      skyState.loc = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      var chip = document.getElementById("skyLoc");
      if (chip) chip.textContent = "📍 已定位";
      if (currentView === "sky") renderSky();
    }, function () {
      fallbackLoc();
    }, { timeout: 8000, maximumAge: 300000 });
  } else {
    fallbackLoc();
  }
}

function fallbackLoc() {
  skyState.loc = { lat: 22.3, lon: 114.2, fallback: true };

    + '<button class="chip' + (skyState.autoRotate ? " active" : "") + '" id="skyRotate">🌠 漫游</button>'
    + '</div>'
    + '<canvas id="skyCanvas"></canvas>'
    + '<div class="legend" id="skyInfo"></div>'
    + '<div id="skyDetail"></div>';
  var canvas = document.getElementById("skyCanvas");
  var cssW = Math.min(720, Math.max(320, content.clientWidth));

    timeInput.addEventListener("change", function () {
      skyState.customJD = timeInput.value ? new Date(timeInput.value).getTime() / 86400000 + 2440587.5 : null;
      renderSky();
    });
    document.getElementById("skyTimeNow").addEventListener("click", function () {
      skyState.customJD = null;
      timeInput.value = localInputValue(new Date());
      renderSky();

  }
  document.querySelectorAll("#cityChips .chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      var name = chip.getAttribute("data-city");
      document.querySelectorAll("#cityChips .chip").forEach(function (c) { c.classList.remove("active"); });

      if (!name) {

            skyState.loc = { lat: CITIES[i][1], lon: CITIES[i][2] };

  document.getElementById("skyIn").addEventListener("click", function () {

  document.getElementById("skyOut").addEventListener("click", function () {

    renderSky();
  });
  document.getElementById("skyAr").addEventListener("click", enterAR);
  document.getElementById("skyGalaxy").addEventListener("click", function () {
    skyState.showGalaxy = !skyState.showGalaxy;
    renderSkyTab();
  });
  document.getElementById("skyDso").addEventListener("click", function () {
    skyState.showDso = !skyState.showDso;
    renderSkyTab();
  });
  document.getElementById("skyShare").addEventListener("click", function () {
    shareSky();
  });
  document.getElementById("skyRotate").addEventListener("click", function () {
    skyState.autoRotate = !skyState.autoRotate;
    renderSkyTab();
  });

  canvas.addEventListener("pointerdown", function (e) {
    dragging = true; dragMoved = false;
    lastPX = e.clientX; lastPY = e.clientY;
    if (skyState.follow) setFollow(false);
    skyState.targetStar = null;
    var d = document.getElementById("skyDetail");
    if (d) d.innerHTML = "";
  });
  canvas.addEventListener("click", function (e) {
    if (dragMoved) return;
    var rect = canvas.getBoundingClientRect();
    var px = (e.clientX - rect.left) * (skyState.cssW / rect.width);
    var py = (e.clientY - rect.top) * (skyState.cssH / rect.height);
    var res = skyHit(px, py);
    var d = document.getElementById("skyDetail");
    if (!d) return;
    if (res && res.s) {
      skyState.targetStar = res.s;
      d.innerHTML = starCard(res.s);
      renderSky();
    } else if (res && res.kind) {
      d.innerHTML = sunMoonCard(res.kind);
    } else if (res && res.bg) {
      d.innerHTML = bgStarCard(res.bg);
    } else if (res && res.dso) {
      d.innerHTML = dsoCard(res.dso);
    } else {
      var chit = hitConstellation(px, py);
      if (chit) d.innerHTML = constellationCard(chit.id);
    }
  });

  // 双击拉近 + 双指缩放
  var pointers = {};
  canvas.addEventListener("pointerdown", function (e) {
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener("pointerup", function (e) {
    delete pointers[e.pointerId];
  });
  canvas.addEventListener("pointercancel", function (e) {
    delete pointers[e.pointerId];
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pointers);
    if (ids.length !== 2) return;
    var a = pointers[ids[0]], b = pointers[ids[1]];
    var prev = skyState.pinchDist || 0;
    var cur = Math.hypot(a.x - b.x, a.y - b.y);
    if (prev > 0 && cur > 0) {
      skyState.fovH = Math.max(30, Math.min(110, skyState.fovH * prev / cur));
      renderSky();
    }
    skyState.pinchDist = cur;
  });
  canvas.addEventListener("pointerup", function () {
    if (Object.keys(pointers).length < 2) skyState.pinchDist = 0;
  });
  canvas.addEventListener("dblclick", function () {
    skyState.fovH = Math.max(30, skyState.fovH * 0.65);
    renderSky();
  });

  renderSky();
  if (!skyState.locTried) {
    skyState.locTried = true;
    tryLocation();
  }
}

function skyHit(px, py) {
  var w = skyState.cssW, h = skyState.cssH;
  var dx = px - w / 2, dy = py - h / 2;
  var rad = skyState.roll * Math.PI / 180;
  var rx = dx * Math.cos(rad) - dy * Math.sin(rad);
  var ry = dx * Math.sin(rad) + dy * Math.cos(rad);
  var qx = w / 2 + rx, qy = h / 2 + ry;
  var best = null, bd = 1e9;
  skyPts.forEach(function (p) {
    var d = Math.sqrt((qx - p.x) * (qx - p.x) + (qy - p.y) * (qy - p.y));
    if (d < bd) { bd = d; best = p; }
  });
  if (!best) return null;
  if (best.s && bd <= best.r + 12) return { s: best.s };
  if (best.sun && bd <= 18) return { kind: "sun" };
  if (best.moon && bd <= 18) return { kind: "moon" };
  if (best.bgI !== undefined && bd <= 14) return { bg: best.bgI };
  if (best.dso && bd <= 14) return { dso: best.dso };
  return null;
}

// ================= AR 实景模式 =================
function enterAR() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("此浏览器不支持调用相机，请用 Chrome 或系统浏览器打开");
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
    .then(function (stream) {
      arStream = stream;
      content.innerHTML = '<div style="position:relative;border-radius:14px;overflow:hidden;border:1px solid #232a54;">'
        + '<video id="arVideo" autoplay playsinline muted style="width:100%;display:block;background:#000;"></video>'
        + '<canvas id="arOverlay" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;"></canvas>'
        + '<div style="position:absolute;left:10px;top:10px;display:flex;gap:8px;">'
        + '<button id="arShot" style="opacity:.9">📸 拍照</button>'
        + '<button id="arExit" style="opacity:.9;background:#232a54;color:#cdd4f5">✖ 退出</button>'
        + '</div></div>'
        + '<div class="legend">把手机朝向天空，星图实时跟随方向。📸 拍照会把星图合成进照片。AR 为方向叠加，不做照片识别。</div>'
        + '<div id="arCapture"></div>';
      var video = document.getElementById("arVideo");
      video.srcObject = stream;
      video.onloadedmetadata = function () { arLoop(); };
      document.getElementById("arExit").addEventListener("click", exitAR);
      document.getElementById("arShot").addEventListener("click", captureAR);
      if (!skyState.follow) setFollow(true);
    })
    .catch(function () {
      alert("无法打开相机：请检查浏览器相机权限。iOS 需要在 HTTPS 环境下才能使用相机。");
    });
}

function exitAR() {
  if (arStream) {
    arStream.getTracks().forEach(function (t) { t.stop(); });
    arStream = null;
  }
  renderView();
}

function arLoop() {
  if (!arStream || currentView !== "sky") return;
  drawAR();
  requestAnimationFrame(arLoop);
}

function drawAR() {
  var video = document.getElementById("arVideo"), ov = document.getElementById("arOverlay");
  if (!video || !ov || !video.videoWidth) return;
  var w = video.clientWidth, h = video.clientHeight;
  if (!w || !h) return;
  ov.width = w; ov.height = h;
  var ctx = ov.getContext("2d");
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate(-skyState.roll * Math.PI / 180);
  ctx.translate(-w / 2, -h / 2);
  STARS.forEach(function (s) {
    if (s.raH === null) return;
    var p = getSkyPos(s);
    if (skyState.showOnlyVisible && p.alt < -1) return;
    var pt = projectPoint(p.az, p.alt, w, h, 62);
    if (pt.x < -20 || pt.x > w + 20 || pt.y < -20 || pt.y > h + 20) return;
    var r = Math.max(2, Math.min(9, (3 - s.mag) * 1.8));
    var hex = colorOf(s.spectral).hex;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
    ctx.fillStyle = hex;
    ctx.shadowColor = hex;
    ctx.shadowBlur = 5;
    ctx.fill();
    ctx.shadowBlur = 0;
    if (s.mag < 0.5) {
      ctx.fillStyle = "#ffffff";
      ctx.font = "11px sans-serif";
      ctx.fillText(s.cn, pt.x + r + 1, pt.y - r - 1);
    }
  });
  ctx.restore();
}

function captureAR() {
  var video = document.getElementById("arVideo");
  if (!video || !video.videoWidth) { alert("相机还没准备好，稍等一秒再拍"); return; }
  var vw = video.videoWidth, vh = video.videoHeight;
  var c = document.createElement("canvas");
  c.width = vw; c.height = vh;
  var ctx = c.getContext("2d");
  ctx.drawImage(video, 0, 0, vw, vh);
  var k = vw / (video.clientWidth || 640);
  ctx.save();
  ctx.translate(vw / 2, vh / 2);
  ctx.rotate(-skyState.roll * Math.PI / 180);
  ctx.translate(-vw / 2, -vh / 2);
  STARS.forEach(function (s) {
    if (s.raH === null) return;
    var p = getSkyPos(s);
    if (skyState.showOnlyVisible && p.alt < -1) return;
    var pt = projectPoint(p.az, p.alt, vw, vh, 62);
    if (pt.x < -40 || pt.x > vw + 40 || pt.y < -40 || pt.y > vh + 40) return;
    var r = Math.max(3, Math.min(16, (3 - s.mag) * 2.6)) * k * 0.9;
    var hex = colorOf(s.spectral).hex;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
    ctx.fillStyle = hex;
    ctx.shadowColor = hex;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
    if (s.mag < 1.0) {
      ctx.fillStyle = "rgba(255,255,255,.95)";
      ctx.font = Math.round(14 * k) + "px sans-serif";
      ctx.fillText(s.cn, pt.x + r + 2, pt.y - r - 2);
    }
  });
  ctx.restore();
  var url = c.toDataURL("image/png");
  document.getElementById("arCapture").innerHTML =
    '<div class="card"><p class="desc">📷 拍好啦！可以长按图片保存到相册，或点下面按钮下载：</p>'
    + '<img src="' + url + '" style="width:100%;border-radius:10px;margin:8px 0;display:block;">'
    + '<a href="' + url + '" download="星空照片.png"><button style="width:100%">⬇️ 下载照片</button></a></div>';
}

// ================= 手机方向感应 =================
function applyOrientation(alpha, beta, gamma) {
  if (!skyState.follow) return;
  if (alpha === null || alpha === undefined) return;
  skyState.az0 = ((alpha % 360) + 360) % 360;
  var b = beta || 0;
  skyState.alt0 = Math.max(-90, Math.min(90, 90 - b));
  skyState.roll = gamma || 0;
  if (currentView === "sky") renderSky();
}
function onAbsOrient(e) { gotAbs = true; applyOrientation(e.alpha, e.beta, e.gamma); }
function onRelOrient(e) {
  if (e.absolute === true) { gotAbs = true; applyOrientation(e.alpha, e.beta, e.gamma); return; }
  if (gotAbs) return;
  var a = (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) ? e.webkitCompassHeading : e.alpha;
  applyOrientation(a, e.beta, e.gamma);
}
window.addEventListener("deviceorientationabsolute", onAbsOrient);
window.addEventListener("deviceorientation", onRelOrient);

document.addEventListener("pointermove", function (e) {
  if (!dragging || currentView !== "sky") return;
  var dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  lastPX = e.clientX; lastPY = e.clientY;
  if (Math.abs(dx) + Math.abs(dy) > 4) dragMoved = true;
  var w = skyState.cssW, h = skyState.cssH;
  var fovV = skyState.fovH * (h / w);
  skyState.az0 = (skyState.az0 - dx / w * skyState.fovH + 360) % 360;
  skyState.alt0 = Math.max(-90, Math.min(90, skyState.alt0 + dy / h * fovV));
  renderSky();
});
document.addEventListener("pointerup", function () { dragging = false; });

function localInputValue(d) {
  var p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}

function updateSunMoonInfo() {
  var el = document.getElementById("sunMoonInfo");
  if (!el) return;
  if (!skyState.loc) {
    el.textContent = "📍 定位或选择城市后，这里显示日出日落时间和月相";
    return;
  }
  var jd = getSkyJD();
  var st = sunTimes(jd, skyState.loc.lat, skyState.loc.lon);
  var s;
  if (st.polar) s = st.polar === "day" ? "极昼（太阳不落）" : "极夜（太阳不升）";
  else s = "日出 " + fmtHM(st.rise) + " · 日落 " + fmtHM(st.set);
  var ph = moonIllum(jd);
  el.textContent = s + " ｜ 月相：" + ph.name + "（照亮 " + Math.round(ph.k * 100) + "%）";
}

function sunMoonCard(kind) {
  var jd = getSkyJD();
  if (kind === "sun") {
    var body = "我们最近的恒星，白天最亮的星。";
    if (skyState.loc) {
      var st = sunTimes(jd, skyState.loc.lat, skyState.loc.lon);
      body += st.polar ? (st.polar === "day" ? "当前极昼，太阳不落。" : "当前极夜，太阳不升。")
        : ("今天日出 " + fmtHM(st.rise) + "，日落 " + fmtHM(st.set) + "。");
    } else {
      body += "定位或选择城市后可显示日出日落时间。";
    }
    return '<div class="card"><div class="top"><span class="dot" style="background:#ffd166;color:#ffd166"></span>'
      + '<div><h2>太阳</h2><span class="en">Sun</span></div></div><p class="desc">' + body + '</p></div>';
  }
  var ph = moonIllum(jd);
  var body = "照亮 " + Math.round(ph.k * 100) + "%" + "，月龄 " + ph.age.toFixed(1) + " 天。";
  body += ph.k < 0.02 ? "今天前后是新月。" : (ph.k > 0.98 ? "今天前后是满月！" : "");
  return '<div class="card"><div class="top"><span class="dot" style="background:#dfe6f5;color:#dfe6f5"></span>'
    + '<div><h2>月亮</h2><span class="en">Moon · ' + ph.name + '</span></div></div><p class="desc">' + body + '</p></div>';
}

function bgStarCard(i) {
  var conAbbr = CON_IDS[BG_CON[i]];
  var con = CON_CN[conAbbr] || conAbbr || "未知";
  return '<div class="card"><div class="top"><span class="dot" style="background:#8fa3d8;color:#8fa3d8"></span>'
    + '<div><h2>HIP ' + BG_HIP[i] + '</h2><span class="en">真实星表亮星</span>'
    + '<div class="meta"><span class="tag">星座：' + con + '</span><span class="tag">星等：' + BG_MAG[i] + '</span></div>'
    + '</div></div><p class="desc">来自依巴谷卫星星表（Hipparcos）的真实数据，全表收录 ' + BG_N + ' 颗。</p></div>';
}

function locateStarByName(name) {
  var s = null;
  STARS.forEach(function (x) { if (x.name === name) s = x; });
  if (!s) return;
  skyState.targetStar = s;
  skyState.follow = false;
  var p = getSkyPos(s);
  skyState.az0 = p.az;
  skyState.alt0 = p.alt;
  skyState.fovH = 45;
  setTab("sky");
  var d = document.getElementById("skyDetail");
  if (d) {
    var note = p.alt < 0 ? '<p class="legend">🌑 此刻它在地平线以下（已强制显示，黄色圈标注）</p>'
                         : '<p class="legend">⭐ 已定位到这颗星（黄色圈标注）</p>';
    d.innerHTML = starCard(s) + note;
  }
}

function drawSkySeg(ctx, seg, w, h, okVisible, cid) {
  var a = getSkyPos({ raH: seg[0][0], dec: seg[0][1] });
  var b = getSkyPos({ raH: seg[1][0], dec: seg[1][1] });
  if (!okVisible(a.alt) && !okVisible(b.alt)) return;
  var pa = projectPoint(a.az, a.alt, w, h, skyState.fovH);
  var pb = projectPoint(b.az, b.alt, w, h, skyState.fovH);
  if (Math.abs(pa.x - pb.x) > w * 0.8) return;
  if ((pa.x < -40 && pb.x < -40) || (pa.x > w + 40 && pb.x > w + 40)) return;
  if ((pa.y < -40 && pb.y < -40) || (pa.y > h + 40 && pb.y > h + 40)) return;
  ctx.beginPath();
  ctx.moveTo(pa.x, pa.y);
  ctx.lineTo(pb.x, pb.y);
  ctx.stroke();
  if (cid) skySegHits.push({ id: cid, x1: pa.x, y1: pa.y, x2: pb.x, y2: pb.y });
}

function loadAPOD(dateStr) {
  var st = document.getElementById("apodStatus");
  var body = document.getElementById("apodBody");
  st.textContent = "正在向 NASA 获取 " + dateStr + " 的星图…";
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem("apod_" + dateStr) || "null"); } catch (e) {}
  if (saved) { st.textContent = ""; showAPOD(saved); return; }
  var url = "https://api.nasa.gov/planetary/apod?api_key=" + NASA_KEY + "&date=" + dateStr;
  fetch(url).then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.url) {
      try { localStorage.setItem("apod_" + dateStr, JSON.stringify(d)); } catch (e) {}
      st.textContent = "";
      showAPOD(d);
    } else {
      st.textContent = "NASA 接口返回异常：" + (d && d.msg ? d.msg : "未知错误") + "。免费 key 每日限 50 次，可去 api.nasa.gov 申请自己的 key。";
      body.innerHTML = "";
    }
  }).catch(function () {
    st.textContent = "网络加载失败，可稍后重试，或直接访问 apod.nasa.gov";
    body.innerHTML = "";
  });
}

function showAPOD(d) {
  var body = document.getElementById("apodBody");
  var media;
  if (d.media_type === "video") {
    media = '<div class="hint">今天的内容是视频，请<a href="' + d.url + '" target="_blank">点此到 NASA 观看</a></div>';
  } else {
    var src = d.hdurl || d.url;
    media = '<img src="' + src + '" alt="APOD" style="width:100%;border-radius:14px;display:block;background:#0b0f2b;" onerror="var t=this;t.style.display=\'none\';document.getElementById(\'apodFb\').style.display=\'block\'">'

    + '<div class="en">' + d.date + (d.copyright ? " · © " + d.copyright : "") + '</div>'

}

function fetchISS() {
  fetch("https://api.wheretheiss.at/v1/satellites/25544").then(function (r) { return r.json(); }).then(function (d) {
    var st = document.getElementById("issStatus");
    if (st) st.textContent = "更新于 " + new Date().toLocaleTimeString() + " · 每 5 秒自动刷新";

      h += '<p class="desc">距离你约 <b>' + Math.round(dist) + '</b> km（地面投影）。'
        + (dist < 2500 ? "它就在你附近上空，抬头找找那颗移动的亮点！" : "空间站约 92 分钟绕地球一圈，每天绕 15 圈半。") + '</p>';
    } else {

function greatCircle(lat1, lon1, lat2, lon2) {
  var p1 = lat1 * D2R, p2 = lat2 * D2R;
  var dl = (lon2 - lon1) * D2R, dp = (lat2 - lat1) * D2R;
  var a = Math.sin(dp / 2) * Math.sin(dp / 2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
  return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function drawISSMap(iss) {
  var canvas = document.getElementById("issMap");
  if (!canvas) return;
  var w = Math.min(720, Math.max(320, content.clientWidth));
  var h = Math.round(w * 0.5);
  var dpr = window.devicePixelRatio || 1;
  canvas.style.width = w + "px"; canvas.style.height = h + "px"; canvas.style.margin = "0 auto";
  canvas.width = w * dpr; canvas.height = h * dpr;
  var ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#0b0f2b"; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "rgba(140,160,255,0.15)"; ctx.lineWidth = 1;
  for (var lo = -180; lo <= 180; lo += 30) {
    var x = (lo + 180) / 360 * w;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (var la = -90; la <= 90; la += 30) {
    var y = (90 - la) / 180 * h;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  ctx.fillStyle = "rgba(200,210,255,0.5)"; ctx.font = "10px sans-serif";
  ctx.fillText("赤道", w - 32, h / 2 + 12);
  function mark(lon, lat, color, label, r) {
    var x2 = ((lon + 180) % 360 + 360) % 360 / 360 * w;
    var y2 = (90 - lat) / 180 * h;
    ctx.beginPath(); ctx.arc(x2, y2, r, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = "#eef1ff"; ctx.font = "11px sans-serif";
    ctx.fillText(label, x2 + r + 3, y2 + 4);
  }
  if (iss) mark(iss.longitude, iss.latitude, "#ff6b6b", "ISS", 5);
  if (skyState.loc) mark(skyState.loc.lon, skyState.loc.lat, "#4da6ff", "你", 4);
}

    + '<div class="card"><p class="desc" style="color:#9aa3c7">第 ' + (quizState.i + 1) + ' / ' + QUIZ.length + ' 题 · 已答对 ' + quizState.score + ' 题</p>'
    + '<h2 style="font-size:17px">' + q.q + '</h2><div style="margin-top:10px" id="quizOpts">' + opts + '</div>'
    + '<div id="quizFb" style="margin-top:10px"></div></div>';
  bindBack();
  document.querySelectorAll(".qopt").forEach(function (b) {
    b.addEventListener("click", function () {
      var i = parseInt(b.getAttribute("data-i"), 10);
      var fb = document.getElementById("quizFb");
      document.querySelectorAll(".qopt").forEach(function (x) { x.style.opacity = "0.5"; x.style.pointerEvents = "none"; });
      if (i === q.answer) {
        quizState.score++;
        b.style.background = "#2e7d4f";
        fb.innerHTML = '<p class="desc">✅ 正确！' + (q.note || "") + '</p>';
      } else {
        b.style.background = "#8b3a3a";
        fb.innerHTML = '<p class="desc">❌ 正确答案是「' + q.options[q.answer] + '」。' + (q.note || "") + '</p>';
      }
      fb.innerHTML += '<button id="quizNext" style="margin-top:8px">下一题 →</button>';
      document.getElementById("quizNext").addEventListener("click", function () { quizState.i++; quizShow(); });
    });
  });
}

// ================= v6 动态与互动 =================
var skySegHits = [];
var skyScratch = { alt: 0, az: 0 };
var skyLoopLast = 0;

function rawAltAz(raH, dec, jd, loc, out) {
  if (!loc) { out.alt = dec; out.az = ((raH * 15) % 360 + 360) % 360; return out; }
  var lst = ((gmstDeg(jd) + loc.lon) % 360 + 360) % 360;
  var H = (lst - raH * 15) * D2R;
  var ph = loc.lat * D2R, de = dec * D2R;
  var sinAlt = Math.sin(ph) * Math.sin(de) + Math.cos(ph) * Math.cos(de) * Math.cos(H);
  out.alt = Math.asin(Math.max(-1, Math.min(1, sinAlt))) / D2R;
  out.az = ((Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(ph) - Math.tan(de) * Math.cos(ph)) + Math.PI) / D2R % 360 + 360) % 360;
  return out;
}

function skyLoop(ts) {
  if (currentView !== "sky" || arStream) return;
  if (ts - skyLoopLast >= 33) {
    skyLoopLast = ts;
    if (skyState.autoRotate && !dragging && !skyState.follow) {
      skyState.az0 = (skyState.az0 + 0.02) % 360;
    }
    try { renderSky(ts); } catch (e) {}
  }
  requestAnimationFrame(skyLoop);
}

function hitConstellation(px, py) {
  var best = null, bd = 196;
  for (var i = 0; i < skySegHits.length; i++) {
    var s = skySegHits[i];
    var dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    var len2 = dx * dx + dy * dy;
    if (len2 < 1) continue;
    var t = Math.max(0, Math.min(1, ((px - s.x1) * dx + (py - s.y1) * dy) / len2));
    var qx = s.x1 + t * dx, qy = s.y1 + t * dy;
    var d2 = (px - qx) * (px - qx) + (py - qy) * (py - qy);
    if (d2 < bd) { bd = d2; best = s; }
  }
  return best;
}

function constellationCard(cid) {
  var cn = CON_CN[cid] || cid;
  return '<div class="card"><div class="top"><span class="dot" style="background:#8fa3d8;color:#8fa3d8"></span>'
    + '<div><h2>' + cn + '</h2><span class="en">' + cid + '（星座连线）</span></div></div>'
    + '<p class="desc">这是「' + cn + '」的星座连线。打开「🔗 连线」开关即可看到；点「📖 全部」或「♈ 星座」标签可查看其中的亮星档案。</p></div>';
}

function setTab(view) {
  if (view !== "sky" && arStream) {
    arStream.getTracks().forEach(function (t) { t.stop(); });
    arStream = null;
  }
  if (view !== "discover") clearISSTimer();
  currentView = view;
  tabs.forEach(function (t) {
    t.classList.toggle("active", t.getAttribute("data-view") === view);
  });
  renderView();
}

tabs.forEach(function (t) {
  t.addEventListener("click", function () { setTab(t.getAttribute("data-view")); });
});
